name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}
      - run: cargo build --release --locked
      - name: Package
        run: |
          dir=wa-calendar-agent-${{ matrix.arch }}-linux
          mkdir "$dir"
          cp target/release/wa-calendar-agent deploy/install.sh deploy/wa-calendar-agent.service .env.example "$dir/"
          mkdir "$dir/keep-bridge"
          cp keep-bridge/keep_bridge.py keep-bridge/requirements.txt deploy/keep-bridge.service \
            deploy/keep-bridge-install.sh "$dir/keep-bridge/"
          tar -czf "$dir.tar.gz" "$dir"
          sha256sum "$dir.tar.gz" > "$dir.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}
          path: wa-calendar-agent-*.tar.gz*

  keep-signin:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller gpsoauth pywebview
      - run: pyinstaller --onefile --name keep-signin-windows keep-bridge/get_master_token.py
      - uses: actions/upload-artifact@v4
        with:
          name: keep-signin
          path: dist/keep-signin-windows.exe

  release:
    needs: [build, keep-signin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes wa-calendar-agent-* keep-signin-windows.exe
        env:
          GH_TOKEN: ${{ github.token }}
